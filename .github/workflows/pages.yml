name: Publicar portfolio EC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar somente arquivos do site
        run: |
          mkdir _site
          cp *.html *.css *.js *.svg _site/
          cp -r assets docs content _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Mostrar link da publicacao
        run: echo "Site publicado em ${{ steps.deployment.outputs.page_url }}landing-page.html" >> "$GITHUB_STEP_SUMMARY"
